    <line x1="102" y1="118" x2="150" y2="118"/>
    <line x1="102" y1="142" x2="162" y2="142"/>
    <line x1="102" y1="166" x2="138" y2="166"/>
  </g>
  <text x="128" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#g-gold)" letter-spacing="3">SHOP</text>
  <text x="128" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#f8fafc" letter-spacing="4">LEDGER</text>
